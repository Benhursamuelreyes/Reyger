name: Build Reyger Multi-Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Puerta de calidad: sin esto, los tres buildsucceedían con la suite en
  # rojo. Los jobs de empaquetado dependen de este, así que un test roto
  # impide generar instaladores.
  tests:
    name: Tests (pytest, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Extremos del rango soportado (requires-python >= 3.10; reportlab 5
      # ya no carga en 3.9) y la versión con la que se empaquetan los
      # instaladores. Sin fail-fast, un fallo en una versión no oculta el
      # resultado de las demás.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (tkinter + display virtual)
        # python3-tk/tk-dev: la app es Tkinter.
        # xvfb: varios tests abren una ventana Tk real (p. ej. el desplegable
        # de clientes de ventas), y los runners no tienen display. Con
        # xvfb-run se comportan como en la máquina del desarrollador, en vez
        # de colgarse o de saltarse en silencio.
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev xvfb poppler-utils

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt cubre lo que importa la app y los tests
          # (reportlab, openpyxl, cryptography, ttkthemes...). pywin32 va
          # marcado para Windows, así que pip lo omite en Linux.
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff==0.17.2

      - name: Lint (ruff)
        # Errores de sintaxis y de pyflakes (nombres sin definir, imports
        # sin usar...). Reglas y versión objetivo en pyproject.toml.
        run: ruff check src tests

      - name: Verify test environment is really usable
        # Sin esto el CI podría quedar verde sin ejecutar nada útil:
        # - sin display, los tests con widgets reales se OMITEN en silencio;
        # - sin poppler-utils, los tests que leen el PDF se OMITEN.
        # Se falla aquí, y de forma legible, en vez de depender de leer los
        # skips del informe de pytest.
        run: |
          xvfb-run -a python -c "
          import tkinter, shutil, sys
          raiz = tkinter.Tk(); raiz.destroy()
          if not shutil.which('pdftotext'):
              sys.exit('FALTA pdftotext (poppler-utils)')
          print('entorno de tests OK: Tk + pdftotext')
          "

      - name: Run pytest
        # addopts de pyproject.toml ya excluye el marcador
        # 'orden_dependiente', que solo tiene sentido en local.
        # El código de salida != 0 hace fallar el job y, con `needs`, los
        # builds.
        run: xvfb-run -a python -m pytest -q

  linux:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (tkinter)
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev

      - name: Install Briefcase and dependencies
        run: |
          python -m pip install --upgrade pip
          # Fijar briefcase 0.4.4: 0.4.5 (2026-09-08) rompe create en Linux
          # (host_arch), usa --only-binary y no instala ttkthemes (sdist).
          python -m pip install briefcase==0.4.4
          python -m pip install reportlab qrcode[pil] Pillow ttkthemes platformdirs

      - name: Build AppImage with Briefcase
        run: |
          briefcase create linux appimage
          briefcase build linux appimage
          briefcase package linux appimage

      - name: Verify tkinter in AppImage bundle
        run: |
          BUNDLE=$(ls -d build/*/linux/appimage/*.AppDir 2>/dev/null | head -1)
          if [ -z "$BUNDLE" ]; then
            echo "AppDir no encontrado en build/*/linux/appimage/"
            exit 1
          fi
          "$BUNDLE/usr/python/bin/python3" -c "import tkinter; print('tkinter OK:', tkinter.TkVersion)"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reyger-Linux
          path: dist/Reyger-*.AppImage

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Briefcase and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase==0.4.4
          python -m pip install reportlab qrcode[pil] Pillow ttkthemes platformdirs pywin32

      - name: Build MSI with Briefcase
        run: |
          briefcase create
          briefcase build

      - name: Inject and enable Tkinter in Windows bundle
        shell: powershell
        run: |
          # Copia tkinter/Tcl/Tk al Python embebido, habilita el ._pth,
          # inyecta sitecustomize.py con TCL_LIBRARY/TK_LIBRARY y verifica
          # que import tkinter + crear una ventana Tk() funcionan ANTES
          # de empaquetar el MSI.
          python scripts/bundle_tkinter_windows.py

      - name: Package MSI with Briefcase
        run: briefcase package

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reyger-Windows
          path: dist/*.msi

  macos:
    needs: tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Briefcase and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase==0.4.4
          python -m pip install reportlab qrcode[pil] Pillow platformdirs

      - name: Build DMG with Briefcase
        run: |
          briefcase create
          briefcase build
          briefcase package --adhoc-sign

      - name: Verify macOS app bundle exists
        run: |
          if [ ! -d "build/reyger/macos/app/Reyger.app" ]; then
            echo "Error: Reyger.app no se genero."
            exit 1
          fi
          echo "Reyger.app generado correctamente."

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reyger-macOS
          path: dist/*.dmg
