name: Build Reyger Multi-Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (tkinter)
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev

      - name: Install Briefcase and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase
          python -m pip install reportlab qrcode[pil] Pillow ttkthemes platformdirs

      - name: Build AppImage with Briefcase
        run: |
          briefcase create linux appimage
          briefcase build linux appimage
          briefcase package linux appimage

      - name: Verify tkinter in AppImage bundle
        run: |
          BUNDLE=$(ls -d build/*/linux/appimage/*.AppDir 2>/dev/null | head -1)
          if [ -z "$BUNDLE" ]; then
            echo "AppDir no encontrado en build/*/linux/appimage/"
            exit 1
          fi
          "$BUNDLE/usr/python/bin/python3" -c "import tkinter; print('tkinter OK:', tkinter.TkVersion)"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reyger-Linux
          path: dist/Reyger-*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Briefcase and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase
          python -m pip install reportlab qrcode[pil] Pillow ttkthemes platformdirs pywin32

      - name: Build MSI with Briefcase
        run: |
          briefcase create
          briefcase build

      - name: Inject and enable Tkinter in Windows bundle
        shell: powershell
        run: |
          # 1. Buscar la carpeta de Python embebido dentro de build/
          $targetPy = Get-ChildItem -Path "build" -Recurse -Directory -Filter "python" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $targetPy) {
              $pyExe = Get-ChildItem -Path "build" -Recurse -File -Filter "python.exe" | Select-Object -First 1
              if ($pyExe) { $targetPy = $pyExe.DirectoryName }
          }
          Write-Host "Directorio objetivo de Python: $targetPy"

          # 2. Obtener Python del sistema (GitHub Runner)
          $sysPy = (Get-Command python).Source | Split-Path

          # 3. Copiar binarios, DLLs y archivos TCL/TK
          New-Item -ItemType Directory -Force -Path "$targetPy\Lib\site-packages"
          Copy-Item "$sysPy\DLLs\_tkinter.pyd" "$targetPy\" -Force
          Copy-Item "$sysPy\DLLs\tcl*.dll" "$targetPy\" -Force
          Copy-Item "$sysPy\DLLs\tk*.dll" "$targetPy\" -Force
          Copy-Item "$sysPy\tcl" "$targetPy\tcl" -Recurse -Force
          Copy-Item "$sysPy\Lib\tkinter" "$targetPy\Lib\tkinter" -Recurse -Force
          Copy-Item "$sysPy\Lib\tkinter" "$targetPy\Lib\site-packages\tkinter" -Recurse -Force

          # 4. DESBLOQUEAR el archivo ._pth para que Python reconozca Tkinter
          $pthFile = Get-ChildItem -Path $targetPy -Filter "python*._pth" | Select-Object -First 1
          if ($pthFile) {
              Write-Host "Habilitando librerías en $($pthFile.FullName)..."
              Add-Content -Path $pthFile.FullName -Value "Lib"
              Add-Content -Path $pthFile.FullName -Value "Lib/site-packages"
              Add-Content -Path $pthFile.FullName -Value "."
              (Get-Content $pthFile.FullName) -replace '#import site', 'import site' | Set-Content $pthFile.FullName
          }

      - name: Package MSI with Briefcase
        run: briefcase package

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reyger-Windows
          path: dist/*.msi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Briefcase and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase
          python -m pip install reportlab qrcode[pil] Pillow platformdirs

      - name: Build DMG with Briefcase
        run: |
          briefcase create
          briefcase build
          briefcase package --adhoc-sign

      - name: Verify macOS app bundle exists
        run: |
          if [ ! -d "build/reyger/macos/app/Reyger.app" ]; then
            echo "Error: Reyger.app no se genero."
            exit 1
          fi
          echo "Reyger.app generado correctamente."

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reyger-macOS
          path: dist/*.dmg
