name: Build Reyger Multi-Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (tkinter)
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev

      - name: Install Briefcase and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase
          python -m pip install reportlab qrcode[pil] Pillow ttkthemes platformdirs

      - name: Build AppImage with Briefcase
        run: |
          briefcase create linux appimage
          briefcase build linux appimage
          briefcase package linux appimage

      - name: Verify tkinter in AppImage bundle
        run: |
          BUNDLE=$(ls -d build/*/linux/appimage/*.AppDir 2>/dev/null | head -1)
          if [ -z "$BUNDLE" ]; then
            echo "AppDir no encontrado en build/*/linux/appimage/"
            exit 1
          fi
          "$BUNDLE/usr/python/bin/python3" -c "import tkinter; print('tkinter OK:', tkinter.TkVersion)"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reyger-Linux
          path: dist/Reyger-*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Briefcase and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase
          python -m pip install reportlab qrcode[pil] Pillow ttkthemes platformdirs pywin32

      - name: Build MSI with Briefcase
        run: |
          briefcase create
          briefcase build

      - name: Inject Tkinter into Windows bundle
        run: |
          $sysPy = (Get-Command python).Source | Split-Path
          $targetPy = "build/reyger/windows/app/python"

          if (Test-Path $targetPy) {
              Copy-Item "$sysPy\Lib\tkinter" "$targetPy\Lib\" -Recurse -Force -ErrorAction SilentlyContinue
              Copy-Item "$sysPy\DLLs\_tkinter.pyd" "$targetPy\" -Force -ErrorAction SilentlyContinue
              Copy-Item "$sysPy\DLLs\tcl*.dll" "$targetPy\" -Force -ErrorAction SilentlyContinue
              Copy-Item "$sysPy\DLLs\tk*.dll" "$targetPy\" -Force -ErrorAction SilentlyContinue
              Copy-Item "$sysPy\tcl" "$targetPy\tcl" -Recurse -Force -ErrorAction SilentlyContinue
              echo "Tkinter inyectado con éxito en $targetPy"
          } else {
              echo "No se encontró el directorio $targetPy, revisa la ruta generada por Briefcase."
          }

      - name: Package MSI with Briefcase
        run: briefcase package

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reyger-Windows
          path: dist/*.msi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Briefcase and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase
          python -m pip install reportlab qrcode[pil] Pillow platformdirs

      - name: Build DMG with Briefcase
        run: |
          briefcase create
          briefcase build
          briefcase package --adhoc-sign

      - name: Verify macOS app bundle exists
        run: |
          if [ ! -d "build/reyger/macos/app/Reyger.app" ]; then
            echo "Error: Reyger.app no se genero."
            exit 1
          fi
          echo "Reyger.app generado correctamente."

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reyger-macOS
          path: dist/*.dmg
