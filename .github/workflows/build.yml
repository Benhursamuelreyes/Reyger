name: Build VentaPRO Multi-Platform

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Briefcase and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase
          python -m pip install reportlab qrcode[pil] Pillow ttkthemes platformdirs

      - name: Build AppImage with Briefcase
        run: |
          briefcase create linux appimage
          briefcase build linux appimage
          briefcase package linux appimage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: VentaPRO-Linux
          path: dist/VentaPRO-*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Briefcase and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase
          python -m pip install reportlab qrcode[pil] Pillow ttkthemes platformdirs pywin32

      - name: Build MSI with Briefcase
        run: |
          briefcase create
          briefcase build
          briefcase package

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: VentaPRO-Windows
          path: dist/*.msi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Briefcase and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase
          python -m pip install reportlab qrcode[pil] Pillow platformdirs

      - name: Build DMG with Briefcase
        run: |
          briefcase create
          briefcase build
          briefcase package --adhoc-sign

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: VentaPRO-macOS
          path: dist/*.dmg

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false

      - name: Publish Release and attach assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VentaPRO-Linux/*.AppImage
            dist/VentaPRO-Windows/*.msi
            dist/VentaPRO-macOS/*.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
