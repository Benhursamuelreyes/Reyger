name: Build Reyger Multi-Platform

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Briefcase and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase
          python -m pip install reportlab qrcode[pil] Pillow ttkthemes platformdirs

      - name: Build AppImage with Briefcase
        run: |
          briefcase create linux appimage
          briefcase build linux appimage
          briefcase package linux appimage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reyger-Linux
          path: dist/Reyger-*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Briefcase and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase
          python -m pip install reportlab qrcode[pil] Pillow ttkthemes platformdirs pywin32

      - name: Build MSI with Briefcase
        run: |
          briefcase create
          briefcase build
          briefcase package

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reyger-Windows
          path: dist/*.msi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Briefcase and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase
          python -m pip install reportlab qrcode[pil] Pillow platformdirs

      - name: Build DMG with Briefcase
        run: |
          briefcase create
          briefcase build
          briefcase package --adhoc-sign

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reyger-macOS
          path: dist/*.dmg

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false

      - name: Publish Release and attach assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Reyger-Linux/*.AppImage
            dist/Reyger-Windows/*.msi
            dist/Reyger-macOS/*.dmg
          body: |
            ## Reyger ${{ github.ref_name }}

            Instaladores oficiales de la versión **${{ github.ref_name }}** para las tres plataformas.

            ### Descarga

            | Plataforma | Formato | Descripción |
            |------------|---------|-------------|
            | Windows | `.msi` | Instalador MSI para Windows 10/11 (asistente de instalación) |
            | macOS | `.dmg` | Imagen de disco DMG para macOS (arrastra a Aplicaciones) |
            | Linux | `.AppImage` | Ejecutable portable AppImage (hazlo ejecutable con `chmod +x`) |

            ### Notas

            - Selecciona el archivo correspondiente a tu sistema operativo.
            - Las notas de versión con el detalle de commits y cambios se incluyen automáticamente a continuación.
          generate_release_notes: true
          fail_on_unmatched_files: true
