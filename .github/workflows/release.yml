name: Release Reyger

on:
  push:
    tags:
      - "v*"

jobs:
  # Un tag no debe publicar instaladores con la suite en rojo.
  tests:
    name: Tests (pytest, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Extremos del rango soportado (requires-python >= 3.10; reportlab 5
      # ya no carga en 3.9) y la versión con la que se empaquetan los
      # instaladores. Sin fail-fast, un fallo en una versión no oculta el
      # resultado de las demás.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (tkinter + display virtual)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev xvfb poppler-utils

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff==0.17.2

      - name: Lint (ruff)
        # Errores de sintaxis y de pyflakes (nombres sin definir, imports
        # sin usar...). Reglas y versión objetivo en pyproject.toml.
        run: ruff check src tests

      - name: Verify test environment is really usable
        # Sin esto el CI podría quedar verde sin ejecutar nada útil:
        # sin display los tests con widgets reales se OMITEN en silencio, y
        # sin poppler-utils se OMITEN los que leen el PDF. Se falla aquí, y
        # de forma legible, en vez de depender de leer los skips del informe.
        run: |
          xvfb-run -a python -c "
          import tkinter, shutil, sys
          raiz = tkinter.Tk(); raiz.destroy()
          if not shutil.which('pdftotext'):
              sys.exit('FALTA pdftotext (poppler-utils)')
          print('entorno de tests OK: Tk + pdftotext')
          "

      - name: Run pytest
        run: xvfb-run -a python -m pytest -q

  linux:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (tkinter)
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev xvfb

      - name: Install Briefcase and dependencies
        run: |
          python -m pip install --upgrade pip
          # Fijar briefcase 0.4.4: 0.4.5 (2026-09-08) rompe `create` en
          # Linux (`host_arch`) y no instala LICENSE.rtf para el MSI.
          python -m pip install briefcase==0.4.4
          python -m pip install reportlab qrcode[pil] Pillow ttkthemes platformdirs

      - name: Create AppDir with Briefcase
        run: briefcase create linux appimage

      - name: Bundle Tcl/Tk scripts into AppDir
        run: |
          BUNDLE=$(ls -d build/*/linux/appimage/*.AppDir 2>/dev/null | head -1)
          if [ -z "$BUNDLE" ]; then
            echo "AppDir no encontrado en build/*/linux/appimage/"
            exit 1
          fi
          # El Python de Briefcase (python-build-standalone) enlaza Tcl/Tk
          # 8.6.8 pero NO incluye los scripts (init.tcl/tk.tcl). Sin ellos,
          # tkinter falla con "Can't find a usable init.tcl" en maquinas sin
          # python3-tk del sistema. Se descargan del repo oficial (tag
          # core-8-6-8 = version exacta que exige la lib embebida; una
          # version distinta dispara "version conflict for package Tcl") y
          # se copian a usr/tcl/, donde _ensure_tcl_library() los busca.
          # IMPORTANTE: inyectar ANTES de build, porque es build quien genera
          # el squashfs del AppImage; lo anadido despues no llega al paquete.
          mkdir -p "$BUNDLE/usr/tcl"
          curl -sL https://github.com/tcltk/tcl/archive/refs/tags/core-8-6-8.tar.gz | tar xz
          curl -sL https://github.com/tcltk/tk/archive/refs/tags/core-8-6-8.tar.gz | tar xz
          cp -r tcl-core-8-6-8/library "$BUNDLE/usr/tcl/tcl8.6"
          cp -r tk-core-8-6-8/library "$BUNDLE/usr/tcl/tk8.6"

      - name: Build and package AppImage
        run: |
          briefcase build linux appimage
          briefcase package linux appimage

      - name: Verify Tk() inside packaged AppImage
        run: |
          APPIMAGE=$(ls dist/Reyger-*.AppImage 2>/dev/null | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "AppImage no encontrado en dist/"
            exit 1
          fi
          chmod +x "$APPIMAGE"
          # Verificacion sobre el PAQUETE final (no el AppDir): extraer y
          # comprobar que init.tcl viajo dentro y que se puede crear una
          # ventana Tk() real usando el bootstrap de la app
          # (_ensure_tcl_library). xvfb-run aporta el display.
          rm -rf _verify && mkdir _verify && cd _verify
          "../$APPIMAGE" --appimage-extract > /dev/null
          test -f squashfs-root/usr/tcl/tcl8.6/init.tcl || {
            echo "ERROR: init.tcl no viajo dentro del AppImage"
            exit 1
          }
          PYTHONPATH="squashfs-root/usr/app:squashfs-root/usr/app_packages" \
          xvfb-run -a squashfs-root/usr/python/bin/python3 -c "
          import reyger.app
          import tkinter
          raiz = tkinter.Tk()
          print('Tk OK:', tkinter.TkVersion)
          raiz.destroy()
          "

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reyger-Linux
          path: dist/Reyger-*.AppImage

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Briefcase and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase==0.4.4
          python -m pip install reportlab qrcode[pil] Pillow ttkthemes platformdirs pywin32

      - name: Build MSI with Briefcase
        run: |
          briefcase create
          briefcase build

      - name: Inject and enable Tkinter in Windows bundle
        shell: powershell
        run: |
          # Copia tkinter/Tcl/Tk al Python embebido, habilita el ._pth,
          # inyecta sitecustomize.py con TCL_LIBRARY/TK_LIBRARY y verifica
          # que import tkinter + crear una ventana Tk() funcionan ANTES
          # de empaquetar el MSI.
          python scripts/bundle_tkinter_windows.py

      - name: Package MSI with Briefcase
        run: briefcase package

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reyger-Windows
          path: dist/*.msi

  macos:
    needs: tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Briefcase and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase==0.4.4
          python -m pip install reportlab qrcode[pil] Pillow platformdirs

      - name: Build DMG with Briefcase
        run: |
          briefcase create
          briefcase build
          briefcase package --adhoc-sign

      - name: Verify macOS app bundle exists
        run: |
          if [ ! -d "build/reyger/macos/app/Reyger.app" ]; then
            echo "Error: Reyger.app no se genero."
            exit 1
          fi
          echo "Reyger.app generado correctamente."

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reyger-macOS
          path: dist/*.dmg

  release:
    name: Publish Pre-release
    needs: [tests, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false

      - name: Clean previous release for tag
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          RELS=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate -q ".[] | select(.tag_name == \"$TAG\") | .id")
          for id in $RELS; do
            echo "Eliminando release/draft $id para $TAG"
            gh api "repos/${{ github.repository }}/releases/$id" -X DELETE
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Pre-release and attach assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Reyger-Linux/*.AppImage
            dist/Reyger-Windows/*.msi
            dist/Reyger-macOS/*.dmg
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Reyger ${{ github.ref_name }} (Release)

            Instaladores oficiales de la versión **${{ github.ref_name }}** para las tres plataformas.

            ### Descarga

            | Plataforma | Formato | Descripción |
            |------------|---------|-------------|
            | Windows | `.msi` | Instalador MSI para Windows 10/11 (asistente de instalación) |
            | macOS | `.dmg` | Imagen de disco DMG para macOS (arrastra a Aplicaciones) |
            | Linux | `.AppImage` | Ejecutable portable AppImage (hazlo ejecutable con `chmod +x`) |

            ### Notas

            - Versión **${{ github.ref_name }}**: revisa las notas de versión a continuación.
            - Las notas de versión con el detalle de commits y cambios se generan automáticamente.
