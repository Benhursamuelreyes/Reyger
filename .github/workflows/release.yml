name: Release Reyger

on:
  push:
    tags:
      - "v*"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (tkinter)
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev xvfb

      - name: Install Briefcase and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase
          python -m pip install reportlab qrcode[pil] Pillow ttkthemes platformdirs

      - name: Build AppImage with Briefcase
        run: |
          briefcase create linux appimage
          briefcase build linux appimage

      - name: Bundle Tcl/Tk scripts into AppImage
        run: |
          BUNDLE=$(ls -d build/*/linux/appimage/*.AppDir 2>/dev/null | head -1)
          if [ -z "$BUNDLE" ]; then
            echo "AppDir no encontrado en build/*/linux/appimage/"
            exit 1
          fi
          # El Python de Briefcase (python-build-standalone) enlaza Tcl/Tk
          # 8.6.8 pero NO incluye los scripts (init.tcl/tk.tcl). Sin ellos,
          # tkinter falla con "Can't find a usable init.tcl" en maquinas sin
          # python3-tk del sistema. Se descargan del repo oficial (tag
          # core-8-6-8 = version exacta que exige la lib embebida; una
          # version distinta dispara "version conflict for package Tcl") y
          # se copian a usr/tcl/, donde _ensure_tcl_library() los busca.
          mkdir -p "$BUNDLE/usr/tcl"
          curl -sL https://github.com/tcltk/tcl/archive/refs/tags/core-8-6-8.tar.gz | tar xz
          curl -sL https://github.com/tcltk/tk/archive/refs/tags/core-8-6-8.tar.gz | tar xz
          cp -r tcl-core-8-6-8/library "$BUNDLE/usr/tcl/tcl8.6"
          cp -r tk-core-8-6-8/library "$BUNDLE/usr/tcl/tk8.6"

      - name: Package AppImage with Briefcase
        run: briefcase package linux appimage

      - name: Verify Tk() in AppImage bundle
        run: |
          BUNDLE=$(ls -d build/*/linux/appimage/*.AppDir 2>/dev/null | head -1)
          if [ -z "$BUNDLE" ]; then
            echo "AppDir no encontrado en build/*/linux/appimage/"
            exit 1
          fi
          # Verificacion real: crear una ventana Tk() (no basta con import
          # tkinter, que no inicializa Tcl). Se importa reyger.app primero
          # para ejercer el mecanismo real de la app (_ensure_tcl_library,
          # que fija TCL_LIBRARY/TK_LIBRARY hacia usr/tcl/). xvfb-run aporta
          # el display que el runner headless no tiene.
          PYTHONPATH="$BUNDLE/usr/app:$BUNDLE/usr/app_packages" \
          xvfb-run -a "$BUNDLE/usr/python/bin/python3" -c "
          import reyger.app
          import tkinter
          raiz = tkinter.Tk()
          print('Tk OK:', tkinter.TkVersion)
          raiz.destroy()
          "

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reyger-Linux
          path: dist/Reyger-*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Briefcase and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase
          python -m pip install reportlab qrcode[pil] Pillow ttkthemes platformdirs pywin32

      - name: Build MSI with Briefcase
        run: |
          briefcase create
          briefcase build

      - name: Inject and enable Tkinter in Windows bundle
        shell: powershell
        run: |
          # Copia tkinter/Tcl/Tk al Python embebido, habilita el ._pth,
          # inyecta sitecustomize.py con TCL_LIBRARY/TK_LIBRARY y verifica
          # que import tkinter + crear una ventana Tk() funcionan ANTES
          # de empaquetar el MSI.
          python scripts/bundle_tkinter_windows.py

      - name: Package MSI with Briefcase
        run: briefcase package

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reyger-Windows
          path: dist/*.msi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Briefcase and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase
          python -m pip install reportlab qrcode[pil] Pillow platformdirs

      - name: Build DMG with Briefcase
        run: |
          briefcase create
          briefcase build
          briefcase package --adhoc-sign

      - name: Verify macOS app bundle exists
        run: |
          if [ ! -d "build/reyger/macos/app/Reyger.app" ]; then
            echo "Error: Reyger.app no se genero."
            exit 1
          fi
          echo "Reyger.app generado correctamente."

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reyger-macOS
          path: dist/*.dmg

  release:
    name: Publish Pre-release
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false

      - name: Clean previous release for tag
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          RELS=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate -q ".[] | select(.tag_name == \"$TAG\") | .id")
          for id in $RELS; do
            echo "Eliminando release/draft $id para $TAG"
            gh api "repos/${{ github.repository }}/releases/$id" -X DELETE
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Pre-release and attach assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Reyger-Linux/*.AppImage
            dist/Reyger-Windows/*.msi
            dist/Reyger-macOS/*.dmg
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Reyger ${{ github.ref_name }} (Release)

            Instaladores oficiales de la versión **${{ github.ref_name }}** para las tres plataformas.

            ### Descarga

            | Plataforma | Formato | Descripción |
            |------------|---------|-------------|
            | Windows | `.msi` | Instalador MSI para Windows 10/11 (asistente de instalación) |
            | macOS | `.dmg` | Imagen de disco DMG para macOS (arrastra a Aplicaciones) |
            | Linux | `.AppImage` | Ejecutable portable AppImage (hazlo ejecutable con `chmod +x`) |

            ### Notas

            - Versión **3.0.0-beta.1**: revisa las notas de versión a continuación.
            - Las notas de versión con el detalle de commits y cambios se generan automáticamente.
