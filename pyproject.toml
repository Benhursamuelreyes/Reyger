[project]
name = "reyger"
version = "2.0.0b9"
description = "Reyger — Sistema de ventas y facturación"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "reportlab>=4.0",
    "qrcode[pil]>=7.0",
    "Pillow>=10.0",
    "ttkthemes>=3.0; platform_system != 'Darwin'",
    "platformdirs>=4.0",
]

[tool.briefcase]
project_name = "Reyger"
bundle = "com.reyger"
version = "2.0.0b9"
url = "https://github.com/Benhursamuelreyes/Reyger"
license = "MIT"

[tool.briefcase.app.reyger]
formal_name = "Reyger"
description = "Sistema de ventas y facturación"
sources = ["src/reyger"]
requires = [
    "reportlab>=4.0",
    "qrcode[pil]>=7.0",
    "Pillow>=10.0",
    "ttkthemes>=3.0; platform_system != 'Darwin'",
    "platformdirs>=4.0",
]
main_module = "reyger.app"
console = false
hidden_imports = ["tkinter", "_tkinter", "tcl", "tk"]

[tool.briefcase.app.reyger.linux]
icon = "src/reyger/assets/icono.png"
system_requires = ["ca-certificates", "python3-tk", "tk-dev"]

[tool.briefcase.app.reyger.windows]
icon = "src/reyger/assets/icono"
# Forzar el stub b12: los stubs b10/b11 (los que usa el branch v0.4.4 del
# template con briefcase 0.4.4) NO añaden <home>\Lib ni <home>\DLLs a
# sys.path, así que tkinter nunca se encuentra aunque esté en el bundle.
# El b12 los añade y además sitecustomize.py (scripts/bundle_tkinter_windows.py)
# los inserta en sys.path como red de seguridad.
stub_binary_revision = "12"

[tool.briefcase.app.reyger.macOS]
icon = "src/reyger/assets/icono"
