[project]
name = "reyger"
version = "2.0.0-beta.1"
description = "Reyger — Sistema de ventas y facturación"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "reportlab>=4.0",
    "qrcode[pil]>=7.0",
    "Pillow>=10.0",
    "ttkthemes>=3.0; platform_system != 'Darwin'",
    "platformdirs>=4.0",
]

[tool.briefcase]
project_name = "Reyger"
bundle = "com.reyger"
version = "2.0.0-beta.1"
url = "https://github.com/Benhursamuelreyes/sales_system"
license = "MIT"

[tool.briefcase.app.reyger]
formal_name = "Reyger"
description = "Sistema de ventas y facturación"
sources = ["src/reyger"]
requires = [
    "reportlab>=4.0",
    "qrcode[pil]>=7.0",
    "Pillow>=10.0",
    "ttkthemes>=3.0; platform_system != 'Darwin'",
    "platformdirs>=4.0",
]
main_module = "reyger.app"
console = false

[tool.briefcase.app.reyger.linux]
icon = "src/reyger/assets/icono.png"
system_requires = ["ca-certificates"]

[tool.briefcase.app.reyger.windows]
icon = "src/reyger/assets/icono"

[tool.briefcase.app.reyger.macOS]
icon = "src/reyger/assets/icono"
